services:
  bvoip-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: bvoip-mcp:latest
    container_name: bvoip-mcp-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MCP_HTTP_PORT=8080
      - BVOIP_BASE_URL=https://portal.1stream.com/api/ClientAccess.svc
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
